<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-tsrouter-app"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Create TanStack App - agricloud</title>
    <script>
      // Terapkan preferensi tema sebelum React mount (cegah flash/FOUC).
      try {
        var p = JSON.parse(localStorage.getItem('preferences') || 'null')
        var theme = (p && p.theme) || localStorage.getItem('theme')
        if (theme === 'dark') document.documentElement.classList.add('dark')
        if (p && p.language)
          document.documentElement.setAttribute('lang', p.language)
      } catch (e) {
        /* abaikan */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
